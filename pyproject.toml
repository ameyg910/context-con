[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vendor-review"
version = "0.1.0"
description = "Local, bounded Technical Vendor Evidence Review foundation"
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.24", "langgraph-checkpoint-sqlite==3.1.3", "langchain-google-genai==4.5.2",
  "langchain-ollama==1.1.0", "httpx==0.28.1", "python-dotenv==1.2.4", "beautifulsoup4==4.15.0",
  "fastapi==0.165.0", "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[project.scripts]
vendor-review = "vendor_review.cli:main"
vendor-review-web = "vendor_review.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
vendor_review = ["web/static/*"]
